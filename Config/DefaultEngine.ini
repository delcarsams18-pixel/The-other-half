@echo off
echo Deleting old...
rmdir /s /q Config Source Content Platform 2>nul
del /q TheOtherHalf.uproject .gitignore 2>nul

mkdir Config
mkdir Source\TheOtherHalf\Public
mkdir Source\TheOtherHalf\Private
mkdir Content\Characters\Data
mkdir Content\Story
mkdir Platform\Xbox

echo { "FileVersion": 3, "EngineAssociation": "5.5", "Modules": [{ "Name": "TheOtherHalf", "Type": "Runtime", "LoadingPhase": "Default" }], "TargetPlatforms": ["WindowsNoEditor", "XboxOneGDK"], "Plugins": [{ "Name": "USDImporter", "Enabled": false },{ "Name": "UsdExporter", "Enabled": false },{ "Name": "PythonUSD", "Enabled": false }] } > TheOtherHalf.uproject

echo /Platform/Android/ > .gitignore
echo Build/Android/ >> .gitignore
echo Binaries/ >> .gitignore
echo Intermediate/ >> .gitignore
echo Saved/ >> .gitignore
echo !Content/ >> .gitignore
echo !Config/ >> .gitignore
echo !Source/ >> .gitignore
echo !/Platform/Xbox/ >> .gitignore

echo [/Script/EngineSettings.GameMapsSettings] > Config\DefaultEngine.ini
echo GameDefaultMap=/Game/Maps/BenwayCity.BenwayCity >> Config\DefaultEngine.ini
echo EditorStartupMap=/Game/Maps/BenwayCity.BenwayCity >> Config\DefaultEngine.ini
echo [USD] >> Config\DefaultEngine.ini
echo bEnableUSD=False >> Config\DefaultEngine.ini

echo [/Script/EngineSettings.GeneralProjectSettings] > Config\DefaultGame.ini
echo ProjectName=The Other Half >> Config\DefaultGame.ini

echo [/Script/Engine.InputSettings] > Config\DefaultInput.ini

echo using UnrealBuildTool; public class TheOtherHalfTarget : TargetRules { public TheOtherHalfTarget(TargetInfo Target) : base(Target) { Type = TargetType.Game; DefaultBuildSettings = BuildSettingsVersion.V4; ExtraModuleNames.Add("TheOtherHalf"); } } > Source\TheOtherHalf.Target.cs
echo using UnrealBuildTool; public class TheOtherHalfEditorTarget : TargetRules { public TheOtherHalfEditorTarget(TargetInfo Target) : base(Target) { Type = TargetType.Editor; DefaultBuildSettings = BuildSettingsVersion.V4; ExtraModuleNames.Add("TheOtherHalf"); } } > Source\TheOtherHalfEditor.Target.cs
echo using UnrealBuildTool; public class TheOtherHalf : ModuleRules { public TheOtherHalf(ReadOnlyTargetRules Target) : base(Target) { PCHUsage = PCHUsageMode.UseExplicitOrSharedPCHs; PublicDependencyModuleNames.AddRange(new string[] { "Core", "CoreUObject", "Engine", "InputCore" }); } } > Source\TheOtherHalf\TheOtherHalf.Build.cs

