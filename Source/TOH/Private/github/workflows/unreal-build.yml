name: Unreal Build Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project files
        shell: powershell
        run: |
          if (Test-Path "TOH.uproject") {
            Write-Host "Project file found: TOH.uproject"
          } else {
            Write-Host "Project file missing."
            exit 1
          }

          if (Test-Path "Source/TOH/Public/Hero.h") {
            Write-Host "Hero data file found."
          } else {
            Write-Host "Hero.h missing."
            exit 1
          }

          if (Test-Path "Source/TOH/Private/TOHGameMode.cpp") {
            Write-Host "GameMode data file found."
          } else {
            Write-Host "TOHGameMode.cpp missing."
            exit 1
          }

      - name: Unreal build placeholder
        shell: powershell
        run: |
          Write-Host "This repo is set up for UE 5.5.4."
          Write-Host "Replace this step with your real Unreal build command on a Windows runner with UE installed."
