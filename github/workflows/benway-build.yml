name: TheOtherHalf - Direct Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Editor and Game
        shell: cmd
        run: |
          "C:\opt\ue\5.5.4\Engine\Binaries\DotNET\UnrealBuildTool\UnrealBuildTool.dll" TheOtherHalfEditor Win64 Development -project="%GITHUB_WORKSPACE%\TheOtherHalf.uproject" -WaitMutex -FromMsBuild
          "C:\opt\ue\5.5.4\Engine\Binaries\DotNET\UnrealBuildTool\UnrealBuildTool.dll" TheOtherHalf Win64 Shipping -project="%GITHUB_WORKSPACE%\TheOtherHalf.uproject" -WaitMutex -FromMsBuild
      - name: Kill broken USD on runner
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\opt\ue\5.5.4\Engine\Plugins\Importers\USDImporter" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\opt\ue\5.5.4\Engine\Plugins\Importers\USD" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\opt\ue\5.5.4\Engine\Plugins\Enterprise\USD" -ErrorAction SilentlyContinue
          Write-Host "USD deleted from runner"