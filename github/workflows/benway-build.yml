name: TheOtherHalf - Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build TheOtherHalf
        shell: cmd
        run: |
          "C:\opt\ue\5.5.4\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun -project="%GITHUB_WORKSPACE%\TheOtherHalf.uproject" -platform=Win64 -clientconfig=Shipping -build -cook -stage -pak -archive -archivedirectory="%GITHUB_WORKSPACE%\dist" -map=/Engine/Maps/Empty -utf8output -noP4
      - uses: actions/upload-artifact@v4
        with:
          name: TheOtherHalf-Win64-Shipping
          path: dist/